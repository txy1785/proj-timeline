server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: proj-timeline
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:60MB}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/proj_timeline?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null
    time-zone: ${APP_TIME_ZONE:Asia/Shanghai}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  jwt-secret: ${JWT_SECRET:development-only-secret-change-me-1234567890}
  jwt-hours: 8
  bootstrap-admin: false
  storage:
    root: ${UPLOAD_ROOT:./data/files}
    max-file-bytes: ${UPLOAD_MAX_BYTES:52428800}

